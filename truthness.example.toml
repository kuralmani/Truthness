# Copy to truthness.toml and edit. Without a config file, Truthness enables
# whatever it finds: the `claude` CLI on PATH, ANTHROPIC_API_KEY, GEMINI_API_KEY.

[server]
bind = "127.0.0.1:8787"        # use 0.0.0.0:8787 only behind a reverse proxy with rate limiting
default_provider = "claude-cli"
max_concurrent = 2             # analyses running at once
cache_ttl_hours = 168          # 0 disables the result cache
cache_dir = ".truthness/cache"
max_content_chars = 40000      # how much transcript/page text is sent to the model
allow_private_hosts = false    # keep false on any server other people can reach

# --- Claude Code CLI, using your existing login. Gets web search + fetch only.
[providers.claude-cli]
type = "claude-cli"
# model = "sonnet"             # any alias or model id the CLI accepts
# timeout_secs = 300

# --- Anthropic API (key read from the environment, never from this file)
# [providers.anthropic]
# type = "anthropic"
# model = "claude-opus-5-5"
# api_key_env = "ANTHROPIC_API_KEY"
# web_search = true

# --- Google Gemini API: Google Search grounding, and it can watch YouTube
# videos directly (useful when a video has no captions).
# [providers.gemini]
# type = "gemini"
# model = "gemini-2.5-flash"
# api_key_env = "GEMINI_API_KEY"

# --- Anything OpenAI-compatible: OpenAI, Ollama, LM Studio, vLLM, OpenRouter...
# These have no web search, so results are marked as "from memory only".
# [providers.ollama]
# type = "openai-compatible"
# label = "Llama (local, Ollama)"
# base_url = "http://localhost:11434/v1"
# model = "llama3.3"
#
# [providers.openai]
# type = "openai-compatible"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# model = "gpt-5"

# --- Any command-line tool: the prompt goes to stdin, the answer is read from stdout.
# [providers.gemini-cli]
# type = "command"
# label = "Gemini CLI"
# command = "gemini"
# args = ["-p", "Follow the instructions given on stdin."]
# grounded = true              # set true only if the tool searches the web itself
