[package]
name = "truthness"
version = "0.1.1"
edition = "2021"
description = "Open-source AI fact-checker for videos and web pages, with pluggable models"
license = "MIT"
repository = "https://github.com/kuralmani/Truthness"
readme = "README.md"
keywords = ["fact-checking", "ai", "misinformation", "youtube", "browser-extension"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rust-embed = "8"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
